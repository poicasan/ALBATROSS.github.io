<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albatross - Sistem Pemantauan Perairan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Config Tailwind CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        anta: ['Anta', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white text-gray-800 font-inter">
    
    <!-- Navbar -->
    <nav id="navbar" class="fixed top-0 left-0 w-full z-50 p-4 lg:px-12 transition-all duration-300 bg-white/90 backdrop-blur-sm text-[#118AB2] shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center relative">
            
            <!-- Logo ALBATROSS -->
            <a href="#" id="logo-btn" class="flex items-center transition-transform hover:scale-105">
                <img src="logo ALBATROSS.png" alt="LOGO ALBATROSS" class="h-12 w-auto object-contain">
            </a>

            <!-- Container Kanan: Menu Navigasi + Tombol Mobile -->
            <div class="flex items-center space-x-3">
                <!-- PERBAIKAN 1: Menghapus overflow-x-auto dan no-scrollbar -->
                <ul id="nav-links" class="hidden md:flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm font-semibold tracking-wider sm:tracking-widest uppercase transition-all duration-300 py-1">
                    <li>
                        <a href="index.html" class="nav-item whitespace-nowrap px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 hover:bg-[#118AB2] hover:text-white hover:underline underline-offset-4">
                            BERANDA
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item whitespace-nowrap px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 hover:bg-[#118AB2] hover:text-white hover:underline underline-offset-4">
                            TENTANG KAMI
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item whitespace-nowrap px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 hover:bg-[#118AB2] hover:text-white hover:underline underline-offset-4">
                            ALAT
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item whitespace-nowrap px-3 sm:px-4 py-2 rounded-lg transition-all duration-200 hover:bg-[#118AB2] hover:text-white hover:underline underline-offset-4">
                            DATA
                        </a>
                    </li>
                </ul>

                <button id="mobile-toggle-btn" class="md:hidden text-2xl p-2 transition-colors focus:outline-none">
                    <i id="toggle-icon" class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Section Pembimbing & Pembina -->
<section class="bg-[#1a7f9f] py-16 md:py-24 px-6 mt-20">
    <div class="max-w-5xl mx-auto text-center">
        
        <!-- Judul Section -->
        <h1 class="text-white text-4xl md:text-5xl font-anta tracking-wide mb-12">
            Pembimbing & Pembina
        </h1>
        
        <!-- Container Profil (Flexbox untuk sejajar horizontal di PC, vertikal di HP) -->
        <div class="flex flex-col md:flex-row justify-center items-center gap-12 md:gap-24">
            
            <!-- Kartu Profil 1 -->
            <div class="flex flex-col items-center">
                <!-- Ubah src dengan nama file foto asli Anda -->
                <img src="prof-indra.jpeg" alt="Prof. Dr. Ir. Indra Jaya" 
                     class="w-48 h-56 md:w-52 md:h-60 object-cover rounded-2xl shadow-lg mb-5">
                
                <h3 class="text-white font-inter text-lg md:text-xl mb-2">
                    Prof. Dr. Ir. Indra Jaya, M.Sc
                </h3>
                
                <span class="bg-[#2c6981] text-white text-sm font-bold px-4 py-1.5 rounded-md shadow-sm">
                    Pembimbing Akademik
                </span>
            </div>

            <!-- Kartu Profil 2 -->
            <div class="flex flex-col items-center">
                <img src="bang-iqbal.jpeg" alt="Muhammad Iqbal" 
                     class="w-48 h-56 md:w-52 md:h-60 object-cover rounded-2xl shadow-lg mb-5">
                
                <h3 class="text-white font-inter text-lg md:text-xl mb-2">
                    Muhammad Iqbal, S.Pi., M.Si.
                </h3>
                
                <span class="bg-[#2c6981] text-white text-sm font-bold px-4 py-1.5 rounded-md shadow-sm">
                    Pembina
                </span>
            </div>

        </div>
    </div>
</section>

<!-- Section Supervisor -->
<section class="bg-white py-16 md:py-24 px-6 text-center">
    <h2 class="text-[#434b6b] text-4xl md:text-5xl font-anta tracking-wide mb-12">
        Supervisor
    </h2>
</section>
    
</body>
</html>
